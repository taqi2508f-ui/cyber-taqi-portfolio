<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030703">
  <title>CCIT — Cyber Crime Investigation Tool · Demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #030603;
      --surface: #071007;
      --surface-2: #0a170b;
      --surface-3: #0e1e10;
      --border: #18331b;
      --accent: #00f45a;
      --accent-soft: rgba(0,244,90,.1);
      --cyan: #00dcf5;
      --red: #ff4166;
      --amber: #ffc04d;
      --purple: #c586ff;
      --text: #e2f3e4;
      --muted: #89a28c;
      --dim: #5e775f;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sidebar: 236px;
      --radius: 9px;
      --shadow: 0 16px 42px rgba(0,0,0,.22);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: .005em;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) minmax(0,1fr); }
    .sidebar {
      min-height: 100vh;
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column;
      background: linear-gradient(180deg,#09120a 0%,#050a06 68%,#030603 100%);
      border-right: 1px solid var(--border);
      z-index: 5;
    }
    .brand {
      height: 94px; display: flex; align-items: center; gap: 12px;
      padding: 0 20px; border-bottom: 1px solid rgba(24,51,27,.75);
      position: relative; overflow: hidden;
    }
    .brand::after {
      content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px;
      background: linear-gradient(90deg,transparent,var(--accent),transparent); opacity: .65;
    }
    .brand-mark {
      width: 40px; height: 40px; flex: 0 0 40px; border: 1px solid rgba(0,244,90,.44);
      display: grid; place-items: center; color: var(--accent); font: 22px var(--mono);
      background: radial-gradient(circle at 50% 45%,rgba(0,244,90,.16),transparent 68%);
      box-shadow: inset 0 0 22px rgba(0,244,90,.07),0 0 24px rgba(0,244,90,.07);
    }
    .brand-name { color: var(--accent); font: 700 17px var(--mono); letter-spacing: .17em; }
    .brand-sub { margin-top: 4px; color: var(--muted); font: 8px var(--mono); letter-spacing: .105em; white-space: nowrap; }
    .nav-caption { padding: 20px 20px 9px; color: var(--dim); font: 9px var(--mono); letter-spacing: .18em; }
    .nav { display: flex; flex-direction: column; gap: 3px; padding: 0 10px; }
    .nav-item {
      width: 100%; height: 40px; display: flex; align-items: center; gap: 12px;
      padding: 0 12px; cursor: pointer; border: 1px solid transparent;
      background: transparent; color: #97af9a; text-align: left;
      font: 10px var(--mono); letter-spacing: .065em; transition: .16s ease;
      position: relative;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,.025); }
    .nav-item.active {
      color: var(--accent); border-color: rgba(0,244,90,.12);
      background: linear-gradient(90deg,rgba(0,244,90,.11),rgba(0,244,90,.018));
      box-shadow: inset 2px 0 var(--accent);
    }
    .nav-icon { width: 18px; text-align: center; font-size: 15px; opacity: .9; }
    .nav-item.active .nav-icon { text-shadow: 0 0 12px var(--accent); }
    .nav-spacer { flex: 1; }
    .sidebar-status {
      margin: 12px; padding: 12px 12px 11px; border: 1px solid var(--border);
      background: linear-gradient(145deg,rgba(0,244,90,.055),rgba(0,0,0,.12));
    }
    .status-line { display: flex; align-items: center; gap: 8px; color: var(--accent); font: 10px var(--mono); letter-spacing: .06em; }
    .pulse-dot { width: 7px; height: 7px; border-radius: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.7s infinite; }
    @keyframes pulse { 50% { opacity: .42; box-shadow: 0 0 2px var(--accent); } }
    .status-note { padding: 8px 0 0 15px; color: var(--muted); font-size: 10px; }
    .sidebar-foot { padding: 0 14px 15px; color: var(--dim); font: 9px var(--mono); }
    .main-column { min-width: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      height: 58px; flex: 0 0 58px; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 0 28px; background: rgba(4,9,5,.88);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 4;
      backdrop-filter: blur(12px);
    }
    .breadcrumbs { display: flex; align-items: center; gap: 9px; color: var(--dim); font: 10px var(--mono); }
    .breadcrumbs strong { color: var(--muted); font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .portfolio-back {
      display: inline-flex; align-items: center; justify-content: center; min-height: 30px;
      padding: 0 9px; border: 1px solid rgba(0,244,90,.3); background: rgba(0,244,90,.07);
      color: var(--accent); font: 9px var(--mono); letter-spacing: .04em; text-decoration: none;
      white-space: nowrap; transition: .15s ease;
    }
    .portfolio-back:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .preview-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px;
      color: var(--amber); background: rgba(255,192,77,.075); border: 1px solid rgba(255,192,77,.28);
      font: 9px var(--mono); letter-spacing: .1em; white-space: nowrap;
    }
    .preview-pill .dot { width: 6px; height: 6px; background: var(--amber); border-radius: 100%; }
    .icon-btn {
      width: 31px; height: 31px; display: grid; place-items: center; cursor: pointer;
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      transition: .15s;
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .main-content { width: 100%; max-width: 1680px; margin: 0 auto; padding: 27px 30px 38px; flex: 1; }
    .statusbar {
      min-height: 30px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 0 16px; background: #080e08; border-top: 1px solid var(--border);
      color: var(--muted); font: 9px var(--mono); letter-spacing: .025em;
    }
    .statusbar-left, .statusbar-right { display: flex; align-items: center; gap: 14px; }
    .statusbar .accent { color: var(--accent); }
    .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 10px var(--mono); letter-spacing: .17em; }
    h1 { margin: 0; color: var(--text); font: 600 clamp(21px,2vw,28px) var(--sans); letter-spacing: -.035em; }
    .page-description { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .heading-side { display: flex; align-items: center; gap: 9px; }
    .sample-tag {
      display: inline-flex; align-items: center; gap: 6px; color: var(--amber);
      padding: 6px 8px; background: rgba(255,192,77,.06); border: 1px solid rgba(255,192,77,.2);
      font: 9px var(--mono); letter-spacing: .08em; white-space: nowrap;
    }
    .btn {
      min-height: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 0 12px; cursor: pointer; color: var(--accent); background: var(--surface-2);
      border: 1px solid rgba(0,244,90,.42); font: 10px var(--mono); letter-spacing: .065em;
      transition: .16s ease; white-space: nowrap;
    }
    .btn:hover { color: #021005; background: var(--accent); box-shadow: 0 0 18px rgba(0,244,90,.12); }
    .btn.secondary { color: var(--muted); border-color: var(--border); background: var(--surface); }
    .btn.secondary:hover { color: var(--text); border-color: var(--muted); background: var(--surface-2); box-shadow: none; }
    .btn.danger { color: var(--red); border-color: rgba(255,65,102,.38); background: rgba(255,65,102,.055); }
    .btn.danger:hover { color: white; background: var(--red); }
    .btn.small { min-height: 29px; padding: 0 9px; font-size: 9px; }
    .demo-notice {
      display: flex; align-items: flex-start; gap: 10px; margin: 0 0 18px; padding: 10px 12px;
      background: rgba(255,192,77,.045); border: 1px solid rgba(255,192,77,.16);
      color: #b9a87e; font-size: 11px; line-height: 1.55;
    }
    .demo-notice strong { color: var(--amber); font: 10px var(--mono); white-space: nowrap; }
    .demo-notice .notice-icon { color: var(--amber); font-size: 14px; line-height: 1; }
    .grid { display: grid; gap: 13px; }
    .stats-grid { grid-template-columns: repeat(4,minmax(0,1fr)); margin-bottom: 19px; }
    .stat-card {
      min-width: 0; padding: 15px 15px 13px; position: relative; overflow: hidden;
      background: linear-gradient(145deg,var(--surface-2),var(--surface) 76%);
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .stat-card::after { content:""; position:absolute; top:0; left:0; width:28px; height:1px; background:var(--stat-color,var(--accent)); opacity:.85; }
    .stat-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .stat-label { color: var(--muted); font: 9px var(--mono); letter-spacing: .1em; }
    .stat-icon { color: var(--stat-color,var(--accent)); opacity: .78; font-size: 14px; }
    .stat-value { margin-top: 10px; color: var(--text); font: 600 26px var(--mono); letter-spacing: -.055em; }
    .stat-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; color: var(--dim); font-size: 10px; }
    .stat-change { color: var(--stat-color,var(--accent)); font: 9px var(--mono); }
    .section-label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 22px 0 11px; }
    .section-label h2 { margin: 0; color: var(--muted); font: 10px var(--mono); letter-spacing: .14em; }
    .section-label span { color: var(--dim); font: 9px var(--mono); }
    .module-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 9px; }
    .module-card {
      min-height: 73px; display: flex; align-items: center; gap: 11px; padding: 12px;
      cursor: pointer; text-align: left; background: linear-gradient(135deg,var(--surface-2),var(--surface));
      border: 1px solid var(--border); transition: .16s ease;
    }
    .module-card:hover { transform: translateY(-1px); border-color: rgba(0,244,90,.42); background: var(--surface-3); }
    .module-icon {
      width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 34px;
      border: 1px solid color-mix(in srgb,var(--module-color,var(--accent)) 28%,transparent);
      color: var(--module-color,var(--accent)); background: color-mix(in srgb,var(--module-color,var(--accent)) 7%,transparent);
      font-size: 15px;
    }
    .module-title { color: var(--text); font: 9px var(--mono); letter-spacing: .055em; }
    .module-status { display: flex; align-items: center; gap: 5px; margin-top: 6px; color: var(--accent); font: 8px var(--mono); letter-spacing: .07em; }
    .module-status .mini-dot { width: 5px; height: 5px; border-radius: 100%; background: currentColor; }
    .lower-grid { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(260px,1fr); gap: 13px; margin-top: 20px; }
    .panel {
      min-width: 0; background: linear-gradient(155deg,rgba(10,23,11,.88),rgba(5,11,6,.96));
      border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .panel-head { min-height: 45px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--border); }
    .panel-title { color: var(--muted); font: 9px var(--mono); letter-spacing: .12em; }
    .panel-subtitle { color: var(--dim); font: 9px var(--mono); }
    .panel-body { padding: 14px; }
    .chart-legend { display:flex; align-items:center; gap:15px; color:var(--muted); font:9px var(--mono); }
    .legend-dot { width:7px; height:7px; display:inline-block; margin-right:5px; border-radius:100%; background:var(--legend-color); }
    .chart-wrap { width: 100%; height: 184px; }
    .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }
    .chart-grid-line { stroke: #18281a; stroke-width: 1; }
    .chart-text { fill: #627665; font: 9px var(--mono); }
    .chart-area { fill: url(#areaGreen); }
    .chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
    .chart-line2 { fill: none; stroke: var(--cyan); stroke-width: 1.5; opacity: .85; }
    .activity-list { display:flex; flex-direction:column; }
    .activity-row { display:grid; grid-template-columns: 50px 1fr auto; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid rgba(24,51,27,.6); }
    .activity-row:last-child { border-bottom:0; }
    .activity-time { color: var(--dim); font: 9px var(--mono); }
    .activity-title { overflow:hidden; color: var(--text); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .activity-type { margin-top:4px; color:var(--muted); font:8px var(--mono); }
    .badge { display:inline-flex; align-items:center; padding:4px 6px; border:1px solid currentColor; font:8px var(--mono); white-space:nowrap; }
    .badge.good { color:var(--accent); background:rgba(0,244,90,.055); }
    .badge.warn { color:var(--amber); background:rgba(255,192,77,.055); }
    .badge.bad { color:var(--red); background:rgba(255,65,102,.055); }
    .badge.info { color:var(--cyan); background:rgba(0,220,245,.05); }
    .badge.neutral { color:var(--muted); background:rgba(137,162,140,.05); }
    .quick-list { display:grid; gap:8px; }
    .quick-item {
      display:grid; grid-template-columns:28px 150px minmax(0,1fr) 16px; align-items:center; gap:8px;
      min-height:42px; padding:7px 9px; background:rgba(255,255,255,.014); border:1px solid rgba(24,51,27,.7);
      color:var(--muted); cursor:pointer; text-align:left;
    }
    .quick-item:hover { border-color:rgba(0,244,90,.35); background:rgba(0,244,90,.035); }
    .quick-icon { color:var(--quick-color,var(--accent)); font-size:14px; text-align:center; }
    .quick-name { color:var(--quick-color,var(--text)); font:9px var(--mono); letter-spacing:.04em; }
    .quick-desc { overflow:hidden; color:var(--muted); font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .quick-arrow { color:var(--dim); }
    .legal-line { margin: 21px 0 1px; color: var(--dim); font: 9px/1.55 var(--mono); }
    .content-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,.9fr); gap:13px; }
    .content-grid.wide-left { grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr); }
    .stack { display:grid; gap:13px; align-content:start; }
    .form-row { display:flex; align-items:center; gap:9px; }
    .form-label { flex:0 0 auto; color:var(--accent); font:10px var(--mono); }
    .input, .select, .textarea {
      width:100%; min-width:0; color:var(--text); background:#030804; border:1px solid var(--border);
      border-bottom:2px solid rgba(0,244,90,.53); border-radius:0; outline:none;
      padding:9px 11px; font:11px var(--mono);
    }
    .input:focus, .select:focus, .textarea:focus { border-color:var(--accent); background:#071007; }
    .textarea { min-height:190px; resize:vertical; line-height:1.55; }
    .input::placeholder, .textarea::placeholder { color:#526b55; }
    .input-inline { flex:1; }
    .scan-disclaimer { margin-top:10px; color:var(--dim); font:9px/1.5 var(--mono); }
    .scan-summary {
      display:grid; grid-template-columns:104px 1fr; align-items:center; gap:14px; padding:14px;
      background:linear-gradient(135deg,var(--surface-2),var(--surface)); border:1px solid var(--border);
    }
    .score-ring {
      width:91px; height:91px; display:grid; place-items:center; position:relative; border-radius:50%;
      background:conic-gradient(var(--score-color,var(--red)) calc(var(--score,92)*1%),#1b281d 0);
    }
    .score-ring::before { content:""; position:absolute; inset:7px; border-radius:50%; background:var(--surface); border:1px solid var(--border); }
    .score-inner { z-index:1; text-align:center; color:var(--text); font:19px var(--mono); }
    .score-inner small { display:block; margin-top:3px; color:var(--muted); font:8px var(--mono); letter-spacing:.08em; }
    .verdict-label { margin-bottom:7px; color:var(--muted); font:9px var(--mono); letter-spacing:.1em; }
    .verdict { color:var(--red); font:700 15px var(--mono); letter-spacing:.04em; }
    .summary-meta { margin-top:8px; color:var(--muted); font:9px/1.6 var(--mono); overflow-wrap:anywhere; }
    .mini-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .mini-stat { padding:10px 9px; border:1px solid var(--border); background:var(--surface); }
    .mini-stat-label { color:var(--muted); font:8px var(--mono); letter-spacing:.055em; }
    .mini-stat-value { margin-top:7px; color:var(--text); font:17px var(--mono); }
    .indicator-list { display:grid; gap:0; }
    .indicator {
      display:flex; align-items:flex-start; gap:9px; padding:9px 0; border-bottom:1px solid rgba(24,51,27,.6);
      color:var(--muted); font-size:10px; line-height:1.45;
    }
    .indicator:last-child { border-bottom:0; }
    .indicator-mark { color:var(--red); font:12px var(--mono); }
    .indicator b { display:block; color:var(--text); font-weight:500; }
    .indicator small { display:block; margin-top:3px; color:var(--dim); font:9px var(--mono); }
    .tabs { display:flex; gap:0; overflow:auto; padding:0 10px; border-bottom:1px solid var(--border); }
    .tab {
      flex:0 0 auto; padding:12px 11px 10px; border:0; border-bottom:2px solid transparent;
      background:transparent; color:var(--muted); cursor:pointer; font:9px var(--mono); letter-spacing:.045em;
    }
    .tab:hover { color:var(--text); }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .tab-content { min-height:175px; padding:13px; }
    .data-table-wrap { width:100%; overflow:auto; }
    .data-table { width:100%; border-collapse:collapse; min-width:440px; }
    .data-table th { padding:8px 9px; text-align:left; color:var(--accent); background:#0c190d; border-bottom:1px solid rgba(0,244,90,.35); font:8px var(--mono); letter-spacing:.08em; white-space:nowrap; }
    .data-table td { padding:9px; color:var(--muted); border-bottom:1px solid rgba(24,51,27,.63); font:9px var(--mono); vertical-align:top; }
    .data-table tr:nth-child(even) td { background:rgba(255,255,255,.012); }
    .data-table tr:last-child td { border-bottom:0; }
    .data-table td.strong { color:var(--text); }
    .mono-block { margin:0; padding:12px; min-height:145px; overflow:auto; color:var(--accent); background:#020503; border:1px solid var(--border); font:9px/1.65 var(--mono); white-space:pre-wrap; }
    .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:14px 0; }
    .toolbar .input { max-width:330px; }
    .toolbar .select { width:auto; min-width:145px; }
    .progress-track { height:4px; overflow:hidden; background:#142117; }
    .progress-fill { height:100%; width:0; background:var(--accent); box-shadow:0 0 14px var(--accent); transition:width .22s ease; }
    .result-empty { min-height:140px; display:grid; place-items:center; text-align:center; color:var(--dim); font:10px/1.6 var(--mono); }
    .result-empty b { display:block; color:var(--muted); font-weight:500; }
    .theme-options { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .theme-choice {
      min-height:64px; display:flex; align-items:center; gap:11px; padding:12px; cursor:pointer;
      border:1px solid var(--border); background:var(--surface); text-align:left;
    }
    .theme-choice:hover, .theme-choice.selected { border-color:var(--accent); background:var(--accent-soft); }
    .theme-swatch { width:26px; height:26px; border:1px solid rgba(255,255,255,.2); box-shadow:0 0 14px color-mix(in srgb,var(--swatch) 25%,transparent); background:var(--swatch); }
    .theme-choice strong { display:block; color:var(--text); font:10px var(--mono); }
    .theme-choice small { display:block; margin-top:4px; color:var(--muted); font-size:9px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 0; border-bottom:1px solid rgba(24,51,27,.6); }
    .settings-row:last-child { border-bottom:0; }
    .settings-row strong { display:block; color:var(--text); font-size:11px; font-weight:500; }
    .settings-row small { display:block; margin-top:4px; color:var(--muted); font-size:10px; }
    .toggle { width:35px; height:19px; padding:2px; border:1px solid var(--border); background:#101a11; cursor:pointer; }
    .toggle::after { content:""; display:block; width:13px; height:13px; background:var(--muted); transition:.16s; }
    .toggle.on { border-color:rgba(0,244,90,.5); background:rgba(0,244,90,.12); }
    .toggle.on::after { transform:translateX(15px); background:var(--accent); box-shadow:0 0 8px var(--accent); }
    .empty-note { padding:20px; text-align:center; color:var(--dim); font:10px var(--mono); }
    .toast {

      padding:12px 14px; color:var(--text); background:#0c190d; border:1px solid var(--accent);

          {type:"phishing_url",target:"paypa1-secure-login.demo.invalid",verdict:"PHISHING",score:92},
          {type:"phishing_email",target:"sample-message.eml",verdict:"SUSPICIOUS",score:84},
          {type:"malware_file",target:"invoice_viewer_demo.exe",verdict:"HIGH_RISK",score:91},
          {type:"dns_analysis",target:"paypa1-confirm.demo.invalid",verdict:"SUSPICIOUS",score:67}
        ]
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download="ccit-demo-sample-report.json";
      document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(link.href);
      toast("Downloaded a JSON report clearly marked as demo data.");
    }
    function severityTone(severity) { return severity==="CRITICAL"?"bad":severity==="HIGH"?"warn":severity==="MEDIUM"?"info":"good"; }

    document.getElementById("mainNav").addEventListener("click",event=>{
      const button=event.target.closest("[data-page]"); if(button) go(button.dataset.page);
    });
    content.addEventListener("click",event=>{
      const tab=event.target.closest("[data-tab-group]");
      if(tab) {
        const group=tab.dataset.tabGroup;
        const key={phish:"phishTab",email:"emailTab",malware:"malwareTab",dns:"dnsTab",reports:"reportTab"}[group];
        if(key){state[key]=tab.dataset.tab;render();}
        return;
      }
      const pageButton=event.target.closest("[data-page]");
      if(pageButton){go(pageButton.dataset.page);return;}
      const button=event.target.closest("[data-action]");
      if(!button)return;
      const action=button.dataset.action;
      switch(action) {
        case "new-scan": go("phishing"); toast("Choose a demo scenario. All scans are simulated."); break;
        case "phish-demo": state.phishTarget="http://paypa1-secure-login.demo.invalid/verify/account";state.phishTab="SCAN LOG";render();toast("Loaded fictional URL sample.");break;
        case "phish-scan": runDemo(action);break;
        case "email-demo": state.emailText=demoEmail;state.emailTab="HEADERS";render();toast("Loaded fictional email sample.");break;
        case "email-analyze": runDemo(action);break;
        case "email-clear": state.emailText="";state.emailScore=0;state.emailVerdict="UNKNOWN";render();toast("Cleared the sample text from this page.");break;
        case "email-export": exportSample();break;
        case "malware-demo": state.malwarePath="C:\\\\samples\\\\invoice_viewer_demo.exe";runDemo(action);break;
        case "malware-analyze": runDemo(action);break;
        case "dns-demo": state.dnsDomain="paypa1-confirm.demo.invalid";state.dnsTab="DNS RECORDS";render();toast("Loaded fictional DNS sample.");break;
        case "dns-analyze": runDemo(action);break;
        case "network-toggle":
          state.monitoring=!state.monitoring;render();
          if(state.monitoring){clearInterval(state.networkTimer);state.networkTimer=setInterval(()=>{state.networkTick++;if(state.page==="network")render();},1800);toast("Sample traffic stream started. No network data is being collected.");}
          else {clearInterval(state.networkTimer);toast("Sample traffic stream paused.");}
          break;
        case "reports-export": exportSample();break;
        case "signature-reset": state.signatureQuery="";state.signatureCategory="All Categories";state.signatureSeverity="All Severities";render();break;
        case "theme": state.theme=button.dataset.theme;render();toast("Preview theme updated.");break;
        case "toggle-pref": state.preferences[button.dataset.pref]=!state.preferences[button.dataset.pref];render();break;
        case "about": toast("CCIT is a defensive cybersecurity desktop app. This is an offline, browser-only UI demonstration with invented data.");break;
      }
    });
    content.addEventListener("input",event=>{
      if(event.target.id==="phishTarget")state.phishTarget=event.target.value;
      if(event.target.id==="emailInput")state.emailText=event.target.value;
      if(event.target.id==="malwarePath")state.malwarePath=event.target.value;
      if(event.target.id==="dnsDomain")state.dnsDomain=event.target.value;
      if(event.target.id==="signatureSearch"){state.signatureQuery=event.target.value;const pos=event.target.selectionStart;render();const next=document.getElementById("signatureSearch");next.focus();next.setSelectionRange(pos,pos);}
      if(event.target.id==="signatureCategory"){state.signatureCategory=event.target.value;render();}
      if(event.target.id==="signatureSeverity"){state.signatureSeverity=event.target.value;render();}
    });
    content.addEventListener("keydown",event=>{
      if(event.key==="Enter"&&event.target.id==="phishTarget"){event.preventDefault();runDemo("phish-scan");}
      if(event.key==="Enter"&&event.target.id==="dnsDomain"){event.preventDefault();runDemo("dns-analyze");}
    });
    document.getElementById("clock").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
    setInterval(()=>document.getElementById("clock").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}),1000);
    render();
  </script>
</body>
</html>
